<!DOCTYPE html>
<!--
================================================================================
 AI SANDBOX HUB  -  single file, no dependencies, works from file://
================================================================================
 Landing page: pick a simulation and it opens on its own.

 Adding a simulation: add one entry to SIMS below.
   href   path to the simulation page (relative to this file)
   tags   used by the filter chips
   status "ready" | "soon"   ("soon" shows the card but you can't open it)

 Themes: every theme is a block of CSS variables under [data-theme="..."].
 To add one, copy a block, rename it, and add it to THEMES.
================================================================================
-->
<html lang="en" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Sandbox</title>
<style>
/* ---------- themes ---------- */
[data-theme="glass"] {          /* matches Glass Box */
  --bg: #0d1117; --bg2: #11161f; --panel: #161b22; --border: #2b3340;
  --text: #e6edf3; --muted: #8b95a3; --accent: #58a6ff; --accent-text: #0d1117;
  --glow: rgba(88,166,255,.18); --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --title-font: var(--font); --radius: 12px; --title-spacing: .5px;
}
[data-theme="terminal"] {       /* green-screen CRT */
  --bg: #050a05; --bg2: #081208; --panel: #0a140a; --border: #1d3b1d;
  --text: #b6ffb0; --muted: #5f9a5a; --accent: #39ff14; --accent-text: #021002;
  --glow: rgba(57,255,20,.16); --font: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --title-font: var(--font); --radius: 2px; --title-spacing: 3px;
}
[data-theme="parchment"] {      /* old map / civilization */
  --bg: #efe4cc; --bg2: #e6d7b8; --panel: #f7efdc; --border: #c9b48a;
  --text: #3b2d1c; --muted: #7a6547; --accent: #8a3b12; --accent-text: #fff6e6;
  --glow: rgba(138,59,18,.14); --font: Georgia, "Palatino Linotype", "Book Antiqua", serif;
  --title-font: var(--font); --radius: 6px; --title-spacing: 1px;
}
[data-theme="neon"] {           /* synthwave */
  --bg: #0b0418; --bg2: #160a2e; --panel: #170c30; --border: #3a1f6b;
  --text: #f4e9ff; --muted: #a58fc9; --accent: #ff3df2; --accent-text: #12031f;
  --glow: rgba(255,61,242,.22); --font: "Trebuchet MS", system-ui, sans-serif;
  --title-font: var(--font); --radius: 14px; --title-spacing: 4px;
}
[data-theme="daylight"] {       /* clean and light */
  --bg: #f6f7f9; --bg2: #eceff3; --panel: #ffffff; --border: #d9dee5;
  --text: #1b2330; --muted: #637083; --accent: #2563eb; --accent-text: #ffffff;
  --glow: rgba(37,99,235,.12); --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --title-font: var(--font); --radius: 16px; --title-spacing: 0;
}

/* ---------- layout ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, var(--glow), transparent 70%), var(--bg);
  color: var(--text); font: 15px/1.5 var(--font);
  transition: background-color .3s, color .3s;
}
[data-theme="terminal"] body::after {   /* scanlines */
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}
[data-theme="neon"] body {
  background:
    linear-gradient(transparent 60%, rgba(255,61,242,.08)),
    radial-gradient(900px 500px at 50% -10%, rgba(0,229,255,.18), transparent 70%), var(--bg);
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 0; }
.logo { font-weight: 700; letter-spacing: var(--title-spacing); display: flex; align-items: center; gap: 8px; }
.logo svg { width: 22px; height: 22px; color: var(--accent); }

.themes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.themes span { color: var(--muted); font-size: 13px; margin-right: 2px; }
.swatch {
  display: flex; align-items: center; gap: 6px; cursor: pointer; font: 13px var(--font);
  background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 5px;
}
.swatch i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 1px solid rgba(128,128,128,.4); }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow); }

.hero { text-align: center; padding: 48px 0 32px; }
.hero h1 {
  font: 700 clamp(34px, 7vw, 64px)/1.05 var(--title-font); letter-spacing: var(--title-spacing); margin: 0 0 12px;
}
[data-theme="neon"] .hero h1 { color: #fff; text-shadow: 0 0 12px #ff3df2, 0 0 32px #ff3df2, 0 0 60px #00e5ff; }
[data-theme="terminal"] .hero h1 { color: var(--accent); text-shadow: 0 0 10px rgba(57,255,20,.6); }
[data-theme="terminal"] .hero h1::after { content: "_"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero p { color: var(--muted); max-width: 560px; margin: 0 auto; font-size: 17px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0 24px; }
.chip {
  cursor: pointer; font: 14px var(--font); color: var(--muted); background: transparent;
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px;
}
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 30px var(--glow); outline: none; }
.card.soon { opacity: .6; cursor: default; }
.card .icon {
  width: 44px; height: 44px; border-radius: calc(var(--radius) * .7); display: grid; place-items: center;
  background: var(--bg2); color: var(--accent); border: 1px solid var(--border);
}
.card .icon svg { width: 24px; height: 24px; }
.card h2 { font: 600 18px/1.25 var(--title-font); margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.card .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.card .tags b { font-weight: 500; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
.card .go { color: var(--accent); font-weight: 600; font-size: 14px; white-space: nowrap; }
.badge {
  position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  background: var(--bg2); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
}
.empty { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 32px 0; }
footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 48px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>
      AI Sandbox
    </div>
    <div class="themes" id="themes"><span>Theme</span></div>
  </header>

  <section class="hero">
    <h1>AI Sandbox</h1>
    <p>Worlds where learning agents figure things out for themselves. Pick a simulation to open it.</p>
  </section>

  <nav class="filters" id="filters" aria-label="Filter simulations"></nav>
  <main class="grid" id="grid"></main>

  <footer>Your progress is saved in each simulation in this browser.</footer>
</div>

<script>
const GB = 'projects/glass-box/index.html';
const ICONS = {
  grid: '<path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>',
  box: '<path d="M3 7 12 3l9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',
  house: '<path d="M3 11 12 4l9 7M5 10v10h14V10M10 20v-6h4v6"/>',
  tree: '<path d="M12 2 5 12h4l-3 5h12l-3-5h4zM12 17v5"/>',
  fist: '<path d="M7 11V7a2 2 0 0 1 4 0v4M11 10V6a2 2 0 0 1 4 0v5M15 10a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a6 6 0 0 1-6-6v-2a2 2 0 0 1 2-2h3"/>',
  spear: '<path d="M4 20 18 6M18 6l2-4-4 2zM8 12l4 4"/>',
  people: '<circle cx="8" cy="7" r="3"/><circle cx="17" cy="8" r="2.5"/><path d="M2 21v-2a5 5 0 0 1 10 0v2M14 21v-2a4 4 0 0 1 8 0v2"/>',
};

const SIMS = [
  { id: 'ttt', name: 'Tic-Tac-Toe', icon: 'grid', tags: ['Games'], from: 'Glass Box',
    desc: 'Play against agents that learn from every game, or watch them train against each other.',
    href: GB + '?env=tictactoe', status: 'ready' },
  { id: 'room', name: 'The Room', icon: 'box', tags: ['Puzzles'], from: 'Glass Box',
    desc: 'Agents start out wandering at random and have to work out that the box goes on the button.',
    href: GB + '?env=room', status: 'ready' },
  { id: 'house', name: 'Forest: Build a House', icon: 'house', tags: ['Building', 'Forest'], from: 'Glass Box',
    desc: 'A team has 20 days to build a house on the plot, from laying out the logs to finishing the roof.',
    href: GB + '?env=forest&setting=build', status: 'ready' },
  { id: 'survive', name: 'Forest: Survive', icon: 'tree', tags: ['Survival', 'Forest'], from: 'Glass Box',
    desc: 'Stay alive for 30 days. Find water and food, and learn which berries make you sick.',
    href: GB + '?env=forest&setting=survive', status: 'ready' },
  { id: 'fist', name: 'Fist Fight', icon: 'fist', tags: ['Combat', 'Forest'], from: 'Glass Box',
    desc: 'A sparring ring, fists only: strike, block, shove, pin, or give up.',
    href: GB + '?env=forest&setting=fist', status: 'ready' },
  { id: 'wild', name: 'Fight in the Forest', icon: 'spear', tags: ['Combat', 'Forest'], from: 'Glass Box',
    desc: 'An open fight with sticks, stones and spears lying around.',
    href: GB + '?env=forest&setting=wild', status: 'ready' },
  { id: 'civ', name: 'Embodied Civilization', icon: 'people', tags: ['Civilization', 'Survival', 'Building'], from: 'New',
    desc: 'Agents with physical bodies who learn to walk and grab on their own, then run a civilization together.',
    href: 'projects/embodied-civ/index.html', status: 'soon' },
];

const THEMES = [
  { id: 'glass', name: 'Glass', dot: 'linear-gradient(135deg,#0d1117 50%,#58a6ff 50%)' },
  { id: 'terminal', name: 'Terminal', dot: 'linear-gradient(135deg,#050a05 50%,#39ff14 50%)' },
  { id: 'parchment', name: 'Parchment', dot: 'linear-gradient(135deg,#efe4cc 50%,#8a3b12 50%)' },
  { id: 'neon', name: 'Neon', dot: 'linear-gradient(135deg,#0b0418 50%,#ff3df2 50%)' },
  { id: 'daylight', name: 'Daylight', dot: 'linear-gradient(135deg,#ffffff 50%,#2563eb 50%)' },
];

const store = {   // localStorage can be blocked (private windows, file:// in some setups)
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function setTheme(id) {
  if (!THEMES.some(t => t.id === id)) id = 'glass';
  document.documentElement.dataset.theme = id;
  document.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === id));
  store.set('ai-sandbox/theme', id);
}

let filter = 'All';
function render() {
  const tags = ['All', ...new Set(SIMS.flatMap(s => s.tags))];
  document.getElementById('filters').innerHTML = tags.map(t =>
    `<button class="chip" aria-pressed="${t === filter}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  const shown = SIMS.filter(s => filter === 'All' || s.tags.includes(filter));
  document.getElementById('grid').innerHTML = shown.map(s => {
    const ready = s.status === 'ready';
    const inner = `
      ${ready ? '' : '<span class="badge">Coming soon</span>'}
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon] || ICONS.box}</svg></div>
      <h2>${esc(s.name)}</h2>
      <p>${esc(s.desc)}</p>
      <div class="meta">
        <div class="tags">${s.tags.map(t => `<b>${esc(t)}</b>`).join('')}</div>
        ${ready ? '<span class="go">Enter →</span>' : `<span>${esc(s.from)}</span>`}
      </div>`;
    return ready
      ? `<a class="card" href="${esc(s.href)}" title="${esc(s.from)}">${inner}</a>`
      : `<div class="card soon" aria-disabled="true">${inner}</div>`;
  }).join('') || '<div class="empty">Nothing here yet.</div>';
}

document.getElementById('themes').insertAdjacentHTML('beforeend', THEMES.map(t =>
  `<button class="swatch" data-theme="${t.id}" aria-pressed="false"><i style="background:${t.dot}"></i>${esc(t.name)}</button>`).join(''));
document.getElementById('themes').addEventListener('click', e => {
  const b = e.target.closest('.swatch'); if (b) setTheme(b.dataset.theme);
});
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (b) { filter = b.dataset.tag; render(); }
});
setTheme(store.get('ai-sandbox/theme'));
render();
</script>
</body>
</html>
