<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · Glass Box</title>
<style>
  :root { --bg: #0d0f12; --panel: #14171c; --line: #262b33; --text: #e8e6e1; --muted: #8a8f98; --hue: #4fd1c5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .03em; }
  h1 span { color: var(--hue); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--hue); color: var(--hue); }
  #stage { position: relative; height: calc(100% - 52px); min-height: 360px; }
  #view { width: 100%; height: 100%; display: block; cursor: grab; }
  #status { position: absolute; left: 14px; bottom: 12px; color: var(--muted); font: 12px ui-monospace, monospace; background: rgba(13,15,18,.7); padding: 6px 10px; border-radius: 6px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <a href="../../index.html">← Hub</a>
  <h1>GLASS BOX / <span>PLAYGROUND</span></h1>
  <div class="bar">
    <button id="train">Train</button>
    <button id="import">Import brain…</button><input type="file" id="importFile" accept=".json,application/json" hidden>
    <button id="export">Export brain</button>
    <button id="harness">Harness: off</button>
    <button id="drop">Drop it</button>
    <button id="shove">Shove</button>
    <button id="slow">Slow motion: off</button>
  </div>
</header>
<div id="stage"><canvas id="view"></canvas><div id="status">loading…</div><div id="loading">Loading physics…</div></div>

<script src="../embodied-2d/vendor/mujoco.js"></script>
<script src="../embodied-2d/brain.js"></script>
<script src="../embodied-2d/muscle.js"></script>
<script src="body3d.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const mj = await loadMujocoClassic();
const { BODY, Body3D: Body, Trial3D, TASKS, SIZES, OUTPUT_GROUPS, hardness, nextStage, episodeConfigs, combineRanks, freshBrain } = window.Body3D;
const { Evolution, makeRng, toBase64, fromBase64 } = window.Brain;
const LS_KEY = 'glassbox-playground/v1';   // the agent's brain, kept in this browser
$('#loading').remove();

// three.js scene. MuJoCo is z-up; the world group turns it so three's y is up.
const canvas = $('#view'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0f12); scene.fog = new THREE.Fog(0x0d0f12, 8, 30);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100); camera.position.set(2.6, 1.6, 3.2);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.9, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2e35, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun);
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x1b1f25, roughness: 1 }));
ground.receiveShadow = true; world.add(ground);
const grid = new THREE.GridHelper(60, 60, 0x2c323b, 0x22272e); grid.rotation.x = Math.PI / 2; grid.position.z = 0.001; world.add(grid);

// the body: one three.js group per MuJoCo part, its shapes placed as in the plan (positions relative to the part)
const skin = new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 0.6 }), sole = new THREE.MeshStandardMaterial({ color: 0xa9a49a, roughness: 0.7 });
const groups = {};
for (const p of BODY.parts) {
  const g = new THREE.Group(); groups[p.id] = g; world.add(g);
  for (const s of p.geoms) {
    let mesh;
    if (s.type === 'box') { mesh = new THREE.Mesh(new RoundedBoxGeometry(2 * s.size[0], 2 * s.size[1], 2 * s.size[2], 4, s.soft || 0.01), p.foot || p.toes ? sole : skin); mesh.position.set(s.pos[0] - p.pos[0], s.pos[1] - p.pos[1], s.pos[2] - p.pos[2]); }
    else if (s.type === 'sphere') { mesh = new THREE.Mesh(new THREE.SphereGeometry(s.r, 28, 18), skin); mesh.position.set(s.pos[0] - p.pos[0], s.pos[1] - p.pos[1], s.pos[2] - p.pos[2]); }
    else {
      const a = new THREE.Vector3(...s.from).sub(new THREE.Vector3(...p.pos)), b = new THREE.Vector3(...s.to).sub(new THREE.Vector3(...p.pos));
      mesh = new THREE.Mesh(new THREE.CapsuleGeometry(s.r, a.distanceTo(b), 8, 16), skin);
      mesh.position.copy(a).add(b).multiplyScalar(0.5); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    }
    mesh.castShadow = true; g.add(mesh);
  }
}

/* Two ways to watch: the body on its own (limp, or held in the harness), or an agent: a trained brain trying to
   stand, restarted a moment after each attempt ends. */
let body = new Body(mj), trial = null, brain = null, endAt = 0, slow = false, acc = 0, last = 0;
body.relax();   // no brain: limp
function clearTrial() { if (trial) { trial.free(); trial = null; } }
function reset(harness) {
  const owned = body && body.trialOwned; clearTrial(); if (body && !owned) body.free(); body = new Body(mj); body.setHarness(harness); body.relax();
  $('#harness').textContent = `Harness: ${harness ? 'on' : 'off'}`; $('#harness').classList.toggle('on', harness);
}
function startAgent() {
  const owned = body && body.trialOwned; clearTrial(); if (body && !owned) body.free();
  trial = new Trial3D(mj, brain.skill || 'stand', [Float32Array.from(brain.params)], { seed: (Math.random() * 1e9) | 0, hard: hardness(brain.stage || 0), keepSimulating: true });
  trial.maxSteps = Infinity; body = trial.agents[0].body; body.trialOwned = true; endAt = 0;
}
$('#harness').onclick = () => reset(!(body && body.harness));
$('#drop').onclick = () => { if (brain) startAgent(); else reset(false); };
$('#shove').onclick = () => { const a = Math.random() * Math.PI * 2; body.shove('chest', Math.cos(a) * 40, Math.sin(a) * 40); };
$('#import').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.params) || !Array.isArray(j.sizes) || j.sizes.join() !== SIZES.join()) throw new Error('that brain is for a different body or senses');
    if (Train.running) Train.stop();
    brain = j; saveBrain(); startAgent(); $('#drop').textContent = 'Restart'; renderButtons();
  } catch (err) { $('#status').textContent = 'Could not load: ' + err.message; }
};
$('#slow').onclick = () => { slow = !slow; $('#slow').textContent = `Slow motion: ${slow ? 'on' : 'off'}`; $('#slow').classList.toggle('on', slow); };

/* ---------- training on every CPU core (background workers built from this page's own scripts) ---------- */
function __trainerWorker3D() {
  let ready = null;
  self.onmessage = async e => {
    const m = e.data;
    if (!ready) ready = loadMujocoClassic().then(mj => { self.MJ = mj; });
    await ready;
    const genomes = m.genomes.map(g => new Float32Array(g)), scores = [], successes = [];
    for (const ep of m.episodes) { const t = new self.Body3D.Trial3D(self.MJ, ep.taskId, genomes, ep.cfg); scores.push(t.run()); successes.push(t.successes()); t.free(); }
    self.postMessage({ id: m.id, scores, successes });
  };
}
const Pool = {
  workers: null, nextId: 1, pending: {},
  start() {
    if (this.workers) return;
    const src = `var __MUJOCO_WASM_B64 = ${JSON.stringify(__MUJOCO_WASM_B64)};\n${__mujocoFactory.toString()}\n${loadMujocoClassic.toString()}\n` +
      `(${__brainModule.toString()})(self);\n(${__muscleModule.toString()})(self);\n(${__body3dModule.toString()})(self);\n(${__trainerWorker3D.toString()})();`;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const n = Math.max(1, Math.min(16, (navigator.hardwareConcurrency || 4) - 1));   // leave one core for the page
    this.workers = Array.from({ length: n }, () => { const w = new Worker(url); w.onmessage = e => { const p = this.pending[e.data.id]; if (p) { delete this.pending[e.data.id]; p(e.data); } }; return w; });
  },
  run(episodes, population) {
    const n = this.workers.length, per = Math.ceil(population.length / n), jobs = [];
    for (let w = 0; w < n; w++) {
      const chunk = population.slice(w * per, (w + 1) * per); if (!chunk.length) break;
      const id = this.nextId++;
      jobs.push(new Promise(res => { this.pending[id] = res; this.workers[w].postMessage({ id, episodes, genomes: chunk.map(g => Array.from(g)) }); }));
    }
    return Promise.all(jobs).then(parts => ({ scores: episodes.map((_, e) => [].concat(...parts.map(p => p.scores[e]))), successes: episodes.map((_, e) => [].concat(...parts.map(p => p.successes[e]))) }));
  },
};
const Train = {
  running: false, token: 0, evo: null, genSecs: 0,
  async start() {
    Pool.start();
    const b = brain;
    this.evo = new Evolution({ sizes: SIZES, popSize: 48, seed: (b ? b.generation : 0) + 1, sigma: b ? b.sigma || 0.15 : 0.15,
      parent: b ? Float32Array.from(b.params) : freshBrain(makeRng(1)), outputGroups: OUTPUT_GROUPS, generation: b ? b.generation : 0, history: b ? b.history || [] : [] });
    if (!brain) { brain = { skill: 'stand', stage: 0, generation: 0, sizes: SIZES, params: Array.from(this.evo.best) }; startAgent(); }
    this.running = true; const token = ++this.token; renderButtons();
    while (this.running && token === this.token) {
      const t0 = performance.now(), skill = brain.skill || 'stand';
      const eps = episodeConfigs(skill, brain.stage || 0, this.evo.generation).map(cfg => ({ taskId: skill, cfg }));
      const r = await Pool.run(eps, this.evo.population);
      if (!this.running || token !== this.token) return;
      const combined = combineRanks(r.scores);
      let best = 0; for (let i = 1; i < combined.length; i++) if (combined[i] > combined[best]) best = i;
      const stage = nextStage(brain.stage || 0, r.successes.reduce((s, ep) => s + (ep[best] ? 1 : 0), 0) / r.successes.length);   // harder only while the best copes
      this.evo.tell(combined);
      brain = { skill, stage, generation: this.evo.generation, sigma: this.evo.sigma, sizes: SIZES, history: this.evo.history, params: Array.from(this.evo.best) };
      this.genSecs = (performance.now() - t0) / 1000;
      saveBrain();
      document.title = document.hidden ? `Gen ${this.evo.generation} · training · Playground` : 'Playground · Glass Box';
    }
  },
  stop() { this.running = false; this.token++; document.title = 'Playground · Glass Box'; renderButtons(); },
};
function saveBrain() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(Object.assign({}, brain, { params: undefined, weights: toBase64(Float32Array.from(brain.params)) }))); } catch (e) { /* storage blocked: the brain still lives on the page */ }
}
function loadBrain() {
  try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (j && j.weights && j.sizes && j.sizes.join() === SIZES.join()) { j.params = Array.from(fromBase64(j.weights)); delete j.weights; return j; } } catch (e) {}
  return null;
}
function renderButtons() { $('#train').textContent = Train.running ? 'Stop training' : brain ? 'Train more' : 'Train'; $('#train').classList.toggle('on', Train.running); }
$('#train').onclick = () => { if (Train.running) Train.stop(); else Train.start(); };
$('#export').onclick = () => {
  if (!brain) return void ($('#status').textContent = 'Nothing to export yet: train or import a brain first.');
  const blob = new Blob([JSON.stringify(Object.assign({ bodyPlan: BODY.id }, brain))], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `playground-brain-gen${brain.generation}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
brain = loadBrain();
if (brain) { startAgent(); $('#drop').textContent = 'Restart'; }
renderButtons();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
  acc += slow ? dt * 0.2 : dt; let n = 0;
  while (acc >= 1 / 60 && n++ < 4) {
    if (trial) {
      const ag = trial.agents[0];
      if (ag.done && !endAt) endAt = now + 1500;                    // fell: watch it land, then try again
      if (endAt && now > endAt) startAgent();   // (while training, each new attempt uses the best brain so far)
      trial.step();
    } else body.step();
    acc -= 1 / 60;
  }
  for (const p of BODY.parts) { const { pos, quat } = body.pose(p.id), g = groups[p.id]; g.position.set(...pos); g.quaternion.set(quat[1], quat[2], quat[3], quat[0]); }
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  controls.update(); renderer.render(scene, camera);
  $('#status').textContent = trial
    ? `${Train.running ? `training on ${Pool.workers.length} cores · ${Train.genSecs.toFixed(1)} s/gen · replaying the best · ` : ''}agent · generation ${brain.generation} · difficulty ${Math.round(hardness(brain.stage || 0) * 100)}% · ${trial.time.toFixed(1)} s · ${TASKS.stand.describe(trial.agents[0].st, body)}`
    : `${body.time.toFixed(1)} s · pelvis ${body.pose('pelvis').pos[2].toFixed(2)} m up · ${body.harness ? 'held in the harness' : 'free'} · no brain: the body is limp (Import brain… to watch an agent)`;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
