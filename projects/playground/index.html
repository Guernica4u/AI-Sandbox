<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · Glass Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* a warm, outdoor look: a park on a sunny day */
  :root { --bg: #f4efe4; --panel: #fffaf0; --line: #e2d8c4; --text: #3d362b; --muted: #8a7f6c; --accent: #5f8f4a; --accent-soft: #e4eedb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 Nunito, system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); }
  header a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 800; }
  h1 span { color: var(--accent); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: 600 14px Nunito, system-ui, sans-serif; cursor: pointer; box-shadow: 0 1px 2px rgba(80,60,30,.08); }
  button:hover { background: var(--accent-soft); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #stage { position: relative; height: calc(100% - 56px); min-height: 360px; }
  #view { width: 100%; height: 100%; display: block; cursor: grab; }
  #status { position: absolute; left: 14px; bottom: 12px; color: var(--text); font-size: 13px; background: rgba(255,250,240,.85); padding: 6px 12px; border-radius: 999px; box-shadow: 0 1px 4px rgba(80,60,30,.15); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <a href="../../index.html">← Hub</a>
  <h1>GLASS BOX / <span>PLAYGROUND</span></h1>
  <div class="bar">
    <button id="harness">Harness: off</button>
    <button id="drop">Drop it</button>
    <button id="shove">Shove</button>
    <button id="slow">Slow motion: off</button>
  </div>
</header>
<div id="stage"><canvas id="view"></canvas><div id="status">loading…</div><div id="loading">Loading physics…</div></div>

<script src="../embodied-2d/vendor/mujoco.js"></script>
<script src="body3d.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const mj = await loadMujocoClassic();
const { BODY, Body3D: Body } = window.Body3D;
$('#loading').remove();

// three.js scene. MuJoCo is z-up; the world group turns it so three's y is up.
const canvas = $('#view'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfdcef); scene.fog = new THREE.Fog(0xcfe3ee, 14, 55);   // a clear, hazy sky
renderer.outputColorSpace = THREE.SRGBColorSpace;
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100); camera.position.set(2.6, 1.6, 3.2);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.9, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x6f8a4f, 1.5));   // sky above, grass bounce below
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);              // warm sunlight sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun);
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);
// a grassy field (a little colour variation so it doesn't look like plastic), hills and a few trees far off
const groundGeo = new THREE.PlaneGeometry(120, 120, 80, 80), cols = [], tint = new THREE.Color();
for (let i = 0; i < groundGeo.attributes.position.count; i++) { const n = Math.sin(i * 12.9898) * 43758.5453 % 1; tint.setHSL(0.26 + n * 0.03, 0.36, 0.30 + n * 0.05); cols.push(tint.r, tint.g, tint.b); }
groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
ground.receiveShadow = true; world.add(ground);
const hillMat = new THREE.MeshStandardMaterial({ color: 0x86a96a, roughness: 1 });
for (const [x, y, r, h] of [[-26, 34, 14, 3.5], [8, 40, 18, 4.5], [34, 26, 12, 3], [-40, -10, 16, 4], [30, -36, 15, 3.5]]) {
  const hill = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), hillMat); hill.scale.set(r, r, h); hill.rotation.x = Math.PI / 2; hill.position.set(x, y, 0); world.add(hill);
}
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.9 }), leafMat = new THREE.MeshStandardMaterial({ color: 0x5f8f4a, roughness: 0.9 });
for (const [x, y, k] of [[-25, 6, 1.3], [-20, 22, 1.1], [14, 22, 1.4], [21, 15, 1.2], [-22, -12, 1.3], [18, -17, 1.1], [3, 26, 1.5], [-6, -24, 1.2]]) {
  const t = new THREE.Group(); t.position.set(x, y, 0); t.scale.setScalar(k);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.6, 10), trunkMat); trunk.rotation.x = Math.PI / 2; trunk.position.z = 0.8; trunk.castShadow = true;
  const crown = new THREE.Mesh(new THREE.SphereGeometry(1.1, 18, 14), leafMat); crown.position.z = 2.3; crown.scale.set(1, 1, 1.15); crown.castShadow = true;
  t.add(trunk, crown); world.add(t);
}

// the body: one three.js group per MuJoCo part, its shapes placed as in the plan (positions relative to the part)
// light wood, like an artist's mannequin
const skin = new THREE.MeshStandardMaterial({ color: 0xe0c49c, roughness: 0.55 }), sole = new THREE.MeshStandardMaterial({ color: 0xb8956a, roughness: 0.65 });
const groups = {};
for (const p of BODY.parts) {
  const g = new THREE.Group(); groups[p.id] = g; world.add(g);
  for (const s of p.geoms) {
    let mesh;
    if (s.type === 'box') { mesh = new THREE.Mesh(new RoundedBoxGeometry(2 * s.size[0], 2 * s.size[1], 2 * s.size[2], 4, s.soft || 0.01), p.foot || p.toes ? sole : skin); mesh.position.set(s.pos[0] - p.pos[0], s.pos[1] - p.pos[1], s.pos[2] - p.pos[2]); }
    else if (s.type === 'sphere') { mesh = new THREE.Mesh(new THREE.SphereGeometry(s.r, 28, 18), skin); mesh.position.set(s.pos[0] - p.pos[0], s.pos[1] - p.pos[1], s.pos[2] - p.pos[2]); }
    else {
      const a = new THREE.Vector3(...s.from).sub(new THREE.Vector3(...p.pos)), b = new THREE.Vector3(...s.to).sub(new THREE.Vector3(...p.pos));
      mesh = new THREE.Mesh(new THREE.CapsuleGeometry(s.r, a.distanceTo(b), 8, 16), skin);
      mesh.position.copy(a).add(b).multiplyScalar(0.5); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    }
    mesh.castShadow = true; g.add(mesh);
  }
}

let body = new Body(mj), slow = false, acc = 0, last = 0;
function reset(harness) { body.free(); body = new Body(mj); body.setHarness(harness); $('#harness').textContent = `Harness: ${harness ? 'on' : 'off'}`; $('#harness').classList.toggle('on', harness); }
$('#harness').onclick = () => reset(!body.harness);
$('#drop').onclick = () => reset(false);
$('#shove').onclick = () => { const V = body.views(), id = body.ids.chest; V.qvel[0] += 0.6; V.qvel[1] += (Math.random() - 0.5) * 0.6; };
$('#slow').onclick = () => { slow = !slow; $('#slow').textContent = `Slow motion: ${slow ? 'on' : 'off'}`; $('#slow').classList.toggle('on', slow); };

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
  acc += slow ? dt * 0.2 : dt; let n = 0;
  while (acc >= 1 / 60 && n++ < 4) { body.step(); acc -= 1 / 60; }
  for (const p of BODY.parts) { const { pos, quat } = body.pose(p.id), g = groups[p.id]; g.position.set(...pos); g.quaternion.set(quat[1], quat[2], quat[3], quat[0]); }
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  controls.update(); renderer.render(scene, camera);
  $('#status').textContent = `${body.time.toFixed(1)} s · pelvis ${body.pose('pelvis').pos[2].toFixed(2)} m up · ${body.harness ? 'held in the harness' : 'free'} · no muscles yet, so the body is limp`;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
